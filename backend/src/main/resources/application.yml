server:
  port: 8080

spring:
  application:
    name: group-class
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/group_class?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.ohc.groupclass: debug

group-class:
  jwt:
    secret: ${JWT_SECRET:group-class-thesis-secret-key-please-change-before-deploy}
    expire-minutes: 120
  enroll:
    pay-timeout-minutes: 15
  schedule:
    auto-transition-ms: 60000
    order-timeout-ms: 60000
